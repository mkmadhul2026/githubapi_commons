name: Github API Governance

on:
  workflow_dispatch:

jobs:
  github_api_governance:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run governance
        run: python src/github_api.py --ruleset rulesets/standard-ruleset.json